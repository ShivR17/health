name: Supabase keepalive

# Supabase pauses free projects after 7 idle days. This writes a row every
# 3 days so the project never sleeps. A write, not a read: reads can be
# served from cache and may not register as database activity.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              "$URL/rest/v1/heartbeat?id=eq.1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"pinged_at\":\"$(date -u +%FT%TZ)\"}")
            echo "attempt $i: HTTP $code"
            [ "$code" = "204" ] && exit 0
            sleep $((i * 15))
          done
          echo "Keepalive failed after 5 attempts"
          exit 1

      # GitHub disables scheduled workflows after 60 days of repository
      # inactivity. Calling the enable endpoint resets that counter, so
      # every run pushes the deadline 60 days out and it is never reached.
      - name: Reset the 60-day inactivity counter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
          echo "inactivity counter reset"
